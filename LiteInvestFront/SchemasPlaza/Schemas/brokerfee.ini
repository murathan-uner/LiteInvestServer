; ----------------------------------------------------------------------------
; Поток FORTS_BROKER_FEE_REPL - Поток брокерской комиссии биржи
[dbscheme:CustReplScheme]
; ----------------------------------------------------------------------------
; Схема CustReplScheme - Исходящий поток FEE_BROKER_REPL с p2subfeeder
table=broker_fee
;table=sys_events

[table:CustReplScheme:broker_fee]
field=replID,i8
field=replRev,i8
field=replAct,i8
field=sess_id,i4
;Номер сделки
field=id_deal,i8
;Время заключения сделки в наносекундах по стандарту
field=moment,t
;Время заключения сделки (UNIX-время в UTC)
field=moment_ns,u8
;Код покупателя
field=code_buy,c7
;Код продавца
field=code_sell,c7
;Брокерская комиссия по сделке покупателя
field=broker_fee_buy,d26.2
;Брокерская комиссия по сделке продавца
field=broker_fee_sell,d26.2
;Номер сделки по связке
field=id_deal_multileg,i8

index=IDX_broker_fee_ID_U,UNIQUE,replID
index=IDX_broker_fee_REV_U,UNIQUE,replRev



